name: CI - FarmaLembra

# Executa a pipeline quando houver alterações na main
# ou quando uma Pull Request for aberta para a main.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend - Testes da API
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: back/requirements-ci.txt

      - name: Instalar dependências
        run: python -m pip install -r back/requirements-ci.txt

      - name: Executar testes do backend
        working-directory: back
        run: python -m pytest -v

  frontend:
    name: Frontend - Lint, testes e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/farma-frontend

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/farma-frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar testes unitários
        run: npm run test:unit

      - name: Instalar navegador para testes E2E
        run: npx playwright install --with-deps chromium

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Gerar build de produção
        run: npm run build
