
<ion-content [fullscreen]="true" class="pagina">
  <main class="conteudo">

    <header class="marca">
      <span class="marca-icone">+</span>
      <span>FarmaLembra</span>
    </header>

    <section class="cabecalho">
      <p class="etiqueta">SUA ROTINA DE CUIDADOS</p>
      <h1>{{ titulo }}</h1>
      <p>{{ descricao }}</p>
    </section>

    <section class="cartao-vazio">
      <div class="icone">
        <ion-icon [name]="icone"></ion-icon>
      </div>

      <h2>Este espaço está sendo preparado</h2>

      <p>
        Em breve você poderá utilizar todas as funcionalidades
        desta área do FarmaLembra.
      </p>
    </section>

  </main>
</ion-content>
